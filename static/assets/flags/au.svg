<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 20" role="img" aria-label="Australia flag">
  <rect width="40" height="20" fill="#012169"/>
  <!-- Union Jack canton (top-left quarter) -->
  <g>
    <path d="M0 0 L20 10 M20 0 L0 10" stroke="#fff" stroke-width="2.4"/>
    <path d="M0 0 L20 10 M20 0 L0 10" stroke="#C8102E" stroke-width="1.1"/>
    <rect x="8" width="4" height="10" fill="#fff"/>
    <rect y="3" width="20" height="4" fill="#fff"/>
    <rect x="8.75" width="2.5" height="10" fill="#C8102E"/>
    <rect y="3.75" width="20" height="2.5" fill="#C8102E"/>
  </g>
  <!-- Commonwealth star + Southern Cross (simplified as dots) -->
  <g fill="#fff">
    <circle cx="10" cy="15.5" r="1.7"/>
    <circle cx="30" cy="5.5" r="0.95"/>
    <circle cx="34.5" cy="9" r="0.95"/>
    <circle cx="30" cy="13" r="0.95"/>
    <circle cx="26" cy="9.5" r="0.8"/>
    <circle cx="30.5" cy="9.3" r="0.55"/>
  </g>
</svg>
